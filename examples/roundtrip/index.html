<!DOCTYPE html>
<html>
  <head>
    <title>dcmjs Roundtrip</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1"
    />

    <!-- styles for all examples -->
    <link href="../css/bootstrap.min.css" rel="stylesheet" />

    <!-- styles for this page -->
    <style>
      .qiicrStepUIPanel span {
        padding-left: 15px;
        padding-right: 15px;
      }
      .qiicrStepUIPanel span:hover {
        font-style: oblique;
      }

      .visibleSegment {
        color: #fff;
      }
      .invisibleSegment {
        color: #000;
      }
    </style>
  </head>
  <body>
    <div id="dropZone" class="container">
      <div class="page-header">
        <h1>
          DICOM Data Roundtrip
        </h1>
        <p>
          This example demonstrates roundtrip read-write
        </p>
        <a href="../index.html">Go back to the Examples page</a>
      </div>

      <div class="row" id="mainDisplay" style="border: 1px solid black;">
        <ul>
          <li>
            Drag and drop an instance.
          </li>
        </ul>
        <p id="status">Ready for images...</p>
      </div>
    </div>
  </body>

  <!-- polyfills -->
  <script src="../js/url-search-params.js"></script>

  <!-- third party -->
  <script src="https://unpkg.com/jquery@2.2.4/dist/jquery.js"></script>
  <script src="/js/FileSaver.min.js"></script>
  <script src="https://unpkg.com/jszip@3.1.3/dist/jszip.min.js"></script>
  <script src="/js/jqueryFileDrop.js"></script>

  <!-- our stuff -->
  <script src="/js/dcmjs.js"></script>
  <script src="/helpers/DICOMZero.js"></script>

  <script>
    function status(statusMessage) {
      console.log("status: ", statusMessage);
      $("#status").text(statusMessage);
    }

    var dicomData;
    var dataset;
    var writeBuffer;

    $(document).ready(function() {
      //
      // dropZone
      //
      const dropZone = document.getElementById("dropZone");
      window.addEventListener("resize", function() {
        dropZone.width = window.innerWidth;
        dropZone.height = window.innerHeight;
      });
      window.dispatchEvent(new Event("resize"));

      function handleFileDrop(e) {
        let evt = e.originalEvent;
        evt.stopPropagation();
        evt.preventDefault();

        // Read first file dropped
        const reader = new FileReader();
        reader.onload = (progressEvent) => {
            status("Reading...");
            let arrayBuffer = progressEvent.target.result;
            console.log(arrayBuffer);
            dicomData = dcmjs.data.DicomMessage.readFile(arrayBuffer);
            dataset = dcmjs.data.DicomMetaDictionary.naturalizeDataset(dicomData.dict);
            dataset._meta = dcmjs.data.DicomMetaDictionary.namifyDataset(dicomData.meta);


            const naturalData = dcmjs.data.DicomMetaDictionary.naturalizeDataset(dicomData.dict);
            naturalData["PatientAge"] = "021Y";
            dicomData.dict = dcmjs.data.DicomMetaDictionary.denaturalizeDataset(naturalData);


            writeBuffer = dicomData.write();
            console.log(dataset);
            var blob = new Blob([writeBuffer], {
              type: "application/octet-stream",
            });
            saveAs(blob, "instance.dcm");
            status("Done.");
        }
        reader.readAsArrayBuffer(evt.dataTransfer.files[0]);

        $("#dropZone").bind("drop", handleFileDrop);
      }
      $("#dropZone").bind("drop", handleFileDrop);
    });
  </script>
</html>
